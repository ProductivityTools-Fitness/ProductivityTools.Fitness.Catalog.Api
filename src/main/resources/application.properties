server.port=${SERVER_PORT:8085}
spring.application.name=fitness-catalog-api
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ptfitness-catalog}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Pawel123}
spring.flyway.baseline-on-migrate=true
spring.flyway.fail-on-missing-locations=false

# GIF upload. Spring defaults to 1MB per file, and the largest animation in the
# catalog is ~1.2MB, so the default would reject it. 8MB leaves room to grow.
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=10MB

